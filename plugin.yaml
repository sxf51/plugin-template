name: plugin-template
version: 0.1.1
description: Reference template that exercises every plugin extension point once
enabled: false
metadata:
  owner: capstone
  contact: capstone@example.com
  category: template
  purpose: reference
  license: MIT
  repository: https://github.com/sxf51/plugin-template.git
dependencies: {}
ui:
  pages:
  - name: console
    title:
      zh: 模板控制台
      en: Template Console
    description:
      zh: 演示宿主页面桥接的每一个方法：调接口、上传、取二进制、下载、SSE、提示
      en: Exercises every host page-bridge method - API calls, upload, binary, download,
        SSE, toast
    nav: sidebar
    roles: []
  panels:
  - id: overview
    title:
      zh: 模板总览
      en: Template overview
    description:
      zh: 每种小部件各示范一次，数据全部来自本插件自己的 Web API
      en: One of every widget type, all fed by this plugin's own web API
    widgets:
    - id: note-count
      type: stat
      title:
        zh: 笔记数
        en: Notes
      span: 3
      unit: ''
      hint_field: hint
      source:
        endpoint: stats
        field: notes
        poll: 15
    - id: attachment-count
      type: stat
      title:
        zh: 附件数
        en: Attachments
      span: 3
      source:
        endpoint: stats
        field: attachments
    - id: storage-backend
      type: stat
      title:
        zh: 存储后端
        en: Storage backend
      span: 3
      source:
        endpoint: stats
        field: backend
    - id: plugin-version
      type: stat
      title:
        zh: 版本
        en: Version
      span: 3
      source:
        endpoint: stats
        field: version
    - id: runtime
      type: key-value
      title:
        zh: 运行时上下文
        en: Runtime context
      span: 6
      source:
        endpoint: summary
        poll: 60
    - id: recent-notes
      type: table
      title:
        zh: 最近笔记
        en: Recent notes
      span: 6
      source:
        endpoint: recent
        poll: 20
      columns:
      - key: title
        title:
          zh: 标题
          en: Title
      - key: tag
        title:
          zh: 标签
          en: Tag
        width: 120
      - key: created
        title:
          zh: 创建时间
          en: Created
        width: 180
    - id: daily-line
      type: line-chart
      title:
        zh: 每日新增（折线）
        en: Notes per day (line)
      span: 6
      x_field: day
      series:
      - field: notes
        label:
          zh: 笔记
          en: Notes
      source:
        endpoint: series
        poll: 60
    - id: daily-bar
      type: bar-chart
      title:
        zh: 每日新增（柱状）
        en: Notes per day (bar)
      span: 6
      x_field: day
      series:
      - field: notes
        label:
          zh: 笔记
          en: Notes
      source:
        endpoint: series
        poll: 60
    - id: activity
      type: log-stream
      title:
        zh: 活动流
        en: Activity stream
      span: 6
      max_lines: 120
      source:
        sse: events
    - id: quick-note
      type: form
      title:
        zh: 快速记一条
        en: Quick note
      span: 6
      submit: notes
      schema:
        title:
          type: string
          label:
            zh: 标题
            en: Title
          default: ''
        body:
          type: text
          label:
            zh: 内容
            en: Body
          default: ''
    - id: prune
      type: action
      span: 3
      tone: warning
      label:
        zh: 清理旧记录
        en: Prune old records
      confirm:
        zh: 将删除超出保留上限的笔记与附件（含磁盘文件），确定继续？
        en: Notes and attachments beyond the retention limit are deleted, files included.
          Continue?
      source:
        endpoint: actions/prune
    - id: help
      type: markdown
      span: 9
      content: 'Copy this directory to start a plugin. Rename it, rename `name:`

        above, rename the `template_*` tools and `/template-*` commands,

        then delete whatever you do not need.

        '
config:
  commands:
  - command: /template-note
    usage: /template-note <text>
    description: Save a note through a decorated class tool
    priority: 40
    level: 1
    route: tool
    tool: template_note_tool
    requires_tool: template_note_tool
  - command: /template-notes
    usage: /template-notes
    description: List saved notes through a second decorated class tool
    priority: 41
    level: 1
    route: tool
    tool: template_notes_tool
    requires_tool: template_notes_tool
  - command: /template-format
    usage: /template-format <text>
    description: Normalise note text through a decorated function tool, no storage
      involved
    priority: 44
    level: 1
    route: tool
    tool: template_format_tool
    requires_tool: template_format_tool
  - command: /template-status
    usage: /template-status
    description: Inspect non-secret runtime state through an explicitly registered
      tool
    priority: 42
    level: 1
    route: tool
    tool: template_status_tool
    requires_tool: template_status_tool
  - command: /template-llm
    usage: /template-llm <question>
    description: Show the LLM config the host resolved for this plugin
    priority: 43
    level: 2
    route: tool
    tool: template_llm_tool
    requires_tool: template_llm_tool
  - command: /template-outline
    usage: /template-outline <topic>
    description: Route an outline request through the template subagent
    priority: 39
    level: 2
    route: task
    requires_tool: template_notes_tool
    planner_hints:
      preferred_route: subagent
      preferred_subagent: template_note_curator
      fallback_route: tool
      fallback_tool: template_notes_tool
  tool_access:
    template_note_tool:
      allowed_subagents:
      - template_note_curator
    template_notes_tool:
      allowed_subagents:
      - template_note_curator
      - template_note_reviewer
    template_format_tool:
      allowed_subagents:
      - template_note_curator
      - template_note_reviewer
    template_status_tool:
      allowed_subagents:
      - template_note_curator
      - template_note_reviewer
    template_llm_tool:
      allowed_subagents:
      - template_note_curator
